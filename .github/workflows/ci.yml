name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Non-blocking: the repo currently has pre-existing lint errors (Navbar,
        # Simulator, SolveProblem, help, profile) unrelated to CI setup. Test +
        # Build are the hard gates. Flip this to blocking once that debt is cleared.
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test

      - name: Build
        # NEXT_PUBLIC_* are inlined at build time. Real values live in Vercel;
        # CI uses harmless placeholders so static generation doesn't choke on
        # undefined Firebase config. The server-only FIREBASE_SERVICE_ACCOUNT_JSON
        # is intentionally absent — the grade route degrades gracefully without it.
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-0000000000
